services:
  egress-proxy:
    build: ./proxy
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    ports:
      - "127.0.0.1:3128:3128"
    environment:
      # Inference + claude.ai subscription login/token refresh. Nothing else.
      ALLOWED_HOSTS: "api.anthropic.com,claude.ai,platform.claude.com"
    restart: "no"
